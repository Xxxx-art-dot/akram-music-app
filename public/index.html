<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKRAM APP</title>
  <script>
    // طلب إذن الإشعارات تلقائياً فور فتح التطبيق لأندرويد 13+
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    // تفعيل بطاقة وسائط النظام الرسمية
    function setupSystemMedia() {
      const audio = document.querySelector('audio');
      if (!audio) return;

      if ('mediaSession' in navigator) {
        const syncSession = () => {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: document.querySelector('.current-track-title')?.innerText || 'Akram Audio',
            artist: 'AKRAM APP',
            album: 'Cloud Library',
            artwork: [
              { src: 'https://via.placeholder.com/512.png?text=AKRAM', sizes: '512x512', type: 'image/png' }
            ]
          });

          navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
        };

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          const prevBtn = document.querySelector('[data-action="prev"], .prev-button');
          if (prevBtn) prevBtn.click();
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          const nextBtn = document.querySelector('[data-action="next"], .next-button');
          if (nextBtn) nextBtn.click();
        });

        audio.addEventListener('play', syncSession);
        audio.addEventListener('pause', syncSession);
        audio.addEventListener('loadedmetadata', syncSession);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(setupSystemMedia, 1500);
    });
  </script>
</head>
<body style="background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
  <h3>جاري فتح AKRAM APP...</h3>
</body>
</html>
