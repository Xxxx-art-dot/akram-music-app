name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Initialize Android Platform
      run: |
        npx cap add android
        npx cap copy android

    - name: Inject Permissions & Native MediaSession
      run: |
        python3 -c "
        manifest = 'android/app/src/main/AndroidManifest.xml'
        with open(manifest, 'r', encoding='utf-8') as f:
            c = f.read()
        perms = '''
            <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
            <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
            <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
            <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
        '''
        if 'POST_NOTIFICATIONS' not in c:
            c = c.replace('<application', perms + '\n    <application')
            with open(manifest, 'w', encoding='utf-8') as f:
                f.write(c)
        "
        python3 -c "
        java_path = 'android/app/src/main/java/com/akram/musicapp/MainActivity.java'
        java_code = '''package com.akram.musicapp;

        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = this.bridge.getWebView();
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                        String js = \"setInterval(function() {\" +
                            \"  var audio = document.querySelector('audio');\" +
                            \"  if (audio && !audio.dataset.msAttached) {\" +
                            \"    audio.dataset.msAttached = 'true';\" +
                            \"    function updateSession() {\" +
                            \"      if ('mediaSession' in navigator) {\" +
                            \"        var titleElem = document.querySelector('.current-track-title, h1, h2, h3, .title');\" +
                            \"        var trackName = titleElem ? titleElem.innerText : 'AKRAM TRACK';\" +
                            \"        navigator.mediaSession.metadata = new MediaMetadata({\" +
                            \"          title: trackName,\" +
                            \"          artist: 'AKRAM APP',\" +
                            \"          album: 'Music Player'\" +
                            \"        });\" +
                            \"        navigator.mediaSession.setActionHandler('play', function() { audio.play(); });\" +
                            \"        navigator.mediaSession.setActionHandler('pause', function() { audio.pause(); });\" +
                            \"      }\" +
                            \"    }\" +
                            \"    audio.addEventListener('play', updateSession);\" +
                            \"    audio.addEventListener('playing', updateSession);\" +
                            \"    audio.addEventListener('pause', updateSession);\" +
                            \"    updateSession();\" +
                            \"  }\" +
                            \"}, 1000);\";
                        view.evaluateJavascript(js, null);
                    }
                });
            }
        }'''
        with open(java_path, 'w', encoding='utf-8') as f:
            f.write(java_code)
        "

    - name: Grant Execute Permission to Gradle
      run: chmod +x android/gradlew

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AKRAM-MUSIC-V1.4
        path: android/app/build/outputs/apk/debug/app-debug.apk
